<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 2000" width="800" height="2000">
<defs><style>
@keyframes d1{0%{transform:translate(0,0) rotate(0);opacity:0}3%{opacity:.7}97%{opacity:.4}100%{transform:translate(100px,2000px) rotate(1200deg);opacity:0}}
@keyframes d2{0%{transform:translate(0,0) rotate(0);opacity:0}4%{opacity:.65}96%{opacity:.35}100%{transform:translate(-80px,2000px) rotate(-1000deg);opacity:0}}
@keyframes d3{0%{transform:translate(0,0) rotate(0);opacity:0}2%{opacity:.75}98%{opacity:.45}100%{transform:translate(60px,2000px) rotate(800deg);opacity:0}}
.a{animation:d1 16s linear infinite}.b{animation:d2 20s linear infinite;animation-delay:2s}
.c{animation:d3 14s linear infinite;animation-delay:1s}.d{animation:d1 18s linear infinite;animation-delay:4s}
.e{animation:d2 12s linear infinite;animation-delay:3s}.f{animation:d3 17s linear infinite;animation-delay:5s}
.g{animation:d1 15s linear infinite;animation-delay:6s}.h{animation:d2 19s linear infinite;animation-delay:1.5s}
.i{animation:d3 13s linear infinite;animation-delay:7s}.j{animation:d1 21s linear infinite;animation-delay:.5s}
.k{animation:d2 14s linear infinite;animation-delay:8s}.l{animation:d3 18s linear infinite;animation-delay:3.5s}
.m{animation:d1 13s linear infinite;animation-delay:9s}.n{animation:d2 16s linear infinite;animation-delay:2.5s}
.o{animation:d3 20s linear infinite;animation-delay:4.5s}.q{animation:d1 17s linear infinite;animation-delay:5.5s}
.r{animation:d2 15s linear infinite;animation-delay:6.5s}.s{animation:d3 19s linear infinite;animation-delay:.8s}
</style></defs>
<!-- NO background rect = transparent -->
<!-- BIG petals: 8-12px blocks, high opacity -->
<g class="a"><rect x="70" y="-20" width="10" height="10" fill="#FF6B8A" opacity=".65"/><rect x="74" y="-16" width="4" height="4" fill="#FFA0B4"/></g>
<g class="b"><rect x="180" y="-40" width="8" height="8" fill="#FF87A0" opacity=".55"/></g>
<g class="c"><rect x="300" y="-10" width="10" height="10" fill="#E8506E" opacity=".6"/><rect x="304" y="-6" width="4" height="4" fill="#FFD4DE"/></g>
<g class="d"><rect x="420" y="-30" width="8" height="8" fill="#FF6B8A" opacity=".55"/></g>
<g class="e"><rect x="530" y="-15" width="10" height="10" fill="#FF87A0" opacity=".65"/><rect x="534" y="-11" width="4" height="4" fill="#FFA0B4"/></g>
<g class="f"><rect x="650" y="-25" width="8" height="8" fill="#E8506E" opacity=".55"/></g>
<g class="g"><rect x="750" y="-5" width="10" height="10" fill="#FF6B8A" opacity=".6"/></g>
<g class="h"><rect x="130" y="-35" width="8" height="8" fill="#FF87A0" opacity=".55"/></g>
<g class="i"><rect x="250" y="-20" width="10" height="10" fill="#FFA0B4" opacity=".6"/></g>
<g class="j"><rect x="370" y="-45" width="8" height="8" fill="#FF6B8A" opacity=".5"/></g>
<g class="k"><rect x="480" y="-8" width="10" height="10" fill="#E8506E" opacity=".55"/><rect x="484" y="-4" width="4" height="4" fill="#FFD4DE"/></g>
<g class="l"><rect x="590" y="-28" width="8" height="8" fill="#FF87A0" opacity=".5"/></g>
<g class="m"><rect x="710" y="-18" width="10" height="10" fill="#FF6B8A" opacity=".6"/></g>
<g class="n"><rect x="40" y="-38" width="8" height="8" fill="#FFA0B4" opacity=".5"/></g>
<g class="o"><rect x="200" y="-12" width="10" height="10" fill="#E8506E" opacity=".55"/></g>
<g class="q"><rect x="340" y="-22" width="8" height="8" fill="#FF87A0" opacity=".55"/></g>
<g class="r"><rect x="560" y="-32" width="10" height="10" fill="#FF6B8A" opacity=".6"/><rect x="564" y="-28" width="4" height="4" fill="#FFA0B4"/></g>
<g class="s"><rect x="680" y="-10" width="8" height="8" fill="#E8506E" opacity=".5"/></g>
</svg>
