<g class="g3"><rect x="580" y="7" width="100" height="2" fill="#FF6B8A" opacity=".5"/></g>
<!-- Center blossoms -->
<rect x="384" y="2" width="8" height="8" fill="#FF6B8A" opacity=".6"/>
<rect x="392" y="0" width="8" height="8" fill="#FF87A0" opacity=".5"/>
<rect x="400" y="2" width="8" height="8" fill="#E8506E" opacity=".6"/>
<rect x="408" y="0" width="8" height="8" fill="#FF6B8A" opacity=".5"/>
<rect x="396" y="6" width="8" height="8" fill="#FFA0B4" opacity=".5"/>
<rect x="398" y="4" width="4" height="4" fill="#FFD4DE" opacity=".7"/>
<!-- Side dots -->
<rect x="350" y="4" width="6" height="6" fill="#FF6B8A" opacity=".35"/>
<rect x="440" y="4" width="6" height="6" fill="#FF6B8A" opacity=".35"/>
</svg>
