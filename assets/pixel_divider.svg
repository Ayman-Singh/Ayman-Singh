<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 16" width="800" height="16">
<defs><style>
@keyframes glo{0%,100%{opacity:.25}50%{opacity:.8}}
.g1{animation:glo 2.5s ease-in-out infinite}.g2{animation:glo 2.5s ease-in-out infinite;animation-delay:.8s}.g3{animation:glo 2.5s ease-in-out infinite;animation-delay:1.6s}
</style></defs>
<rect x="40" y="7" width="720" height="2" fill="#21262D"/>
