<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
<defs><style>
@keyframes fall1{0%{transform:translate(0,-30px) rotate(0);opacity:0}5%{opacity:1}95%{opacity:.7}100%{transform:translate(60px,350px) rotate(720deg);opacity:0}}
@keyframes fall2{0%{transform:translate(0,-40px) rotate(0);opacity:0}6%{opacity:.9}94%{opacity:.6}100%{transform:translate(-50px,340px) rotate(-600deg);opacity:0}}
@keyframes fall3{0%{transform:translate(0,-20px) rotate(0);opacity:0}4%{opacity:1}96%{opacity:.7}100%{transform:translate(35px,345px) rotate(540deg);opacity:0}}
@keyframes sway{0%,100%{transform:rotate(-.5deg)}50%{transform:rotate(.5deg)}}
@keyframes glow{0%,100%{opacity:.3}50%{opacity:.8}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes cursor{0%,49%{opacity:1}50%,100%{opacity:0}}
.p1{animation:fall1 6s linear infinite}.p2{animation:fall2 8s linear infinite;animation-delay:1s}
.p3{animation:fall3 7s linear infinite;animation-delay:2s}.p4{animation:fall1 9s linear infinite;animation-delay:3s}
.p5{animation:fall2 5s linear infinite;animation-delay:.5s}.p6{animation:fall3 7s linear infinite;animation-delay:4s}
.p7{animation:fall1 6s linear infinite;animation-delay:2.5s}.p8{animation:fall2 8s linear infinite;animation-delay:1.5s}
.p9{animation:fall3 5.5s linear infinite;animation-delay:3.5s}.p10{animation:fall1 7s linear infinite;animation-delay:.8s}
.p11{animation:fall2 6s linear infinite;animation-delay:4.5s}.p12{animation:fall3 9s linear infinite;animation-delay:1.2s}
.tree{animation:sway 5s ease-in-out infinite;transform-origin:110px 300px}
.gl{animation:glow 3s ease-in-out infinite}.gl2{animation-delay:1s}.gl3{animation-delay:2s}
.st{animation:pulse 3s ease-in-out infinite}.st2{animation-delay:.6s}.st3{animation-delay:1.3s}.st4{animation-delay:2s}
.cur{animation:cursor 1s steps(1) infinite}
</style></defs>

