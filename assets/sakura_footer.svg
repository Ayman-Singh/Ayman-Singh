<rect x="172" y="45" width="2" height="3" fill="#FFA0B4" class="bk" opacity=".8"/>
<rect x="172" y="60" width="2" height="3" fill="#58A6FF" class="bk bk2" opacity=".7"/>
<rect x="172" y="75" width="2" height="3" fill="#FFA0B4" class="bk bk3" opacity=".6"/>

<!-- Buildings - bigger, bolder -->
