<rect x="568" y="60" width="30" height="50" fill="#161B22"/>
<rect x="574" y="66" width="4" height="4" fill="#58A6FF" class="w" opacity=".5"/>
<rect x="586" y="66" width="4" height="4" fill="#58A6FF" class="w w3" opacity=".6"/>

