<rect x="100" y="55" width="35" height="55" fill="#161B22"/>
<rect x="100" y="51" width="35" height="4" fill="#1C2028"/>
<rect x="106" y="60" width="4" height="4" fill="#58A6FF" class="w w3" opacity=".5"/>
<rect x="118" y="60" width="4" height="4" fill="#58A6FF" class="w" opacity=".6"/>
<rect x="106" y="72" width="4" height="4" fill="#58A6FF" class="w w4" opacity=".5"/>
<rect x="118" y="72" width="4" height="4" fill="#58A6FF" class="w w2" opacity=".4"/>
<rect x="106" y="84" width="4" height="4" fill="#58A6FF" class="w" opacity=".5"/>

<!-- Skytree - BIG -->
<rect x="280" y="20" width="6" height="90" fill="#1C2028"/>
<rect x="275" y="16" width="16" height="5" fill="#21262D"/>
<rect x="272" y="12" width="22" height="5" fill="#21262D"/>
