<g class="fp6"><rect x="750" y="5" width="6" height="6" fill="#E8506E" opacity=".5"/></g>

<!-- Footer text -->
<text x="400" y="132" text-anchor="middle" fill="#8B949E" font-family="'Courier New',monospace" font-size="11" letter-spacing="4" opacity=".6">ありがとうございます — THANK YOU FOR VISITING</text>
<text x="400" y="152" text-anchor="middle" fill="#FF6B8A" font-family="'Courier New',monospace" font-size="9" letter-spacing="3" opacity=".4">TOKYO · 東京</text>
</svg>
