<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="800" height="180">
<defs><style>
@keyframes pf1{0%{transform:translate(0,-10px) rotate(0);opacity:0}8%{opacity:.7}92%{opacity:.4}100%{transform:translate(40px,200px) rotate(500deg);opacity:0}}
@keyframes pf2{0%{transform:translate(0,-15px) rotate(0);opacity:0}10%{opacity:.6}90%{opacity:.35}100%{transform:translate(-30px,190px) rotate(-400deg);opacity:0}}
@keyframes gw{0%,100%{opacity:.2}50%{opacity:.9}}
@keyframes bk{0%,100%{opacity:.15}50%{opacity:.7}}
.fp1{animation:pf1 7s linear infinite}.fp2{animation:pf2 6s linear infinite;animation-delay:1s}
.fp3{animation:pf1 8s linear infinite;animation-delay:2s}.fp4{animation:pf2 5s linear infinite;animation-delay:3s}
.fp5{animation:pf1 6s linear infinite;animation-delay:.5s}.fp6{animation:pf2 7s linear infinite;animation-delay:4s}
.w{animation:gw 3s ease-in-out infinite}.w2{animation-delay:.8s}.w3{animation-delay:1.6s}.w4{animation-delay:2.4s}.w5{animation-delay:3.2s}
.bk{animation:bk 4s ease-in-out infinite}.bk2{animation-delay:1.5s}.bk3{animation-delay:3s}
</style></defs>

<rect width="800" height="180" fill="#0D1117"/>

<!-- Tokyo Tower - BIG -->
<rect x="170" y="35" width="6" height="75" fill="#FF6B8A" opacity=".7"/>
<rect x="164" y="50" width="18" height="5" fill="#FF6B8A" opacity=".6"/>
