<rect x="281" y="-8" width="4" height="14" fill="#21262D"/>
<rect x="282" y="30" width="2" height="3" fill="#FF6B8A" class="bk" opacity=".6"/>
<rect x="282" y="50" width="2" height="3" fill="#58A6FF" class="bk bk3" opacity=".5"/>
<rect x="282" y="70" width="2" height="3" fill="#FF6B8A" class="bk bk2" opacity=".6"/>

