<rect x="0" y="108" width="800" height="3" fill="#161B22"/>
<rect x="0" y="108" width="800" height="1" fill="#FF6B8A" opacity=".1"/>

<!-- Falling petals -->
<g class="fp1"><rect x="100" y="5" width="8" height="8" fill="#FF6B8A" opacity=".6"/></g>
<g class="fp2"><rect x="350" y="10" width="6" height="6" fill="#FF87A0" opacity=".5"/></g>
<g class="fp3"><rect x="500" y="3" width="8" height="8" fill="#E8506E" opacity=".6"/></g>
