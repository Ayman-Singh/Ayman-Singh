<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Left Leg (Blue) -->
  <rect x="2" y="10" width="6" height="16" fill="#2A6CD6"/> <!-- shadow -->
  <rect x="2" y="10" width="4" height="16" fill="#4285F4"/>
  <rect x="2" y="10" width="2" height="16" fill="#8AB4F8"/>
  
  <!-- Right Leg (Green) -->
  <rect x="24" y="10" width="6" height="16" fill="#137333"/> <!-- shadow -->
  <rect x="24" y="10" width="4" height="16" fill="#34A853"/>
  <rect x="24" y="10" width="2" height="16" fill="#81C995"/>

  <!-- Top Left Arch (Red) -->
  <rect x="4" y="4" width="4" height="2" fill="#EA4335"/>
  <rect x="2" y="6" width="6" height="4" fill="#C5221F"/>
  <rect x="4" y="6" width="4" height="2" fill="#F28B82"/>
  <rect x="4" y="4" width="4" height="1" fill="#FFFFFF" opacity="0.3"/>
  
  <!-- Left Diagonal (Red) -->
  <rect x="8" y="6" width="2" height="4" fill="#EA4335"/>
  <rect x="10" y="8" width="2" height="4" fill="#EA4335"/>
  <rect x="12" y="10" width="2" height="4" fill="#EA4335"/>
  <rect x="14" y="12" width="2" height="4" fill="#EA4335"/>
  
  <!-- Top Right Arch (Yellow) -->
  <rect x="24" y="4" width="4" height="2" fill="#FBBC04"/>
  <rect x="24" y="6" width="6" height="4" fill="#F29900"/>
  <rect x="24" y="6" width="4" height="2" fill="#FCE8B2"/>
  <rect x="24" y="4" width="4" height="1" fill="#FFFFFF" opacity="0.3"/>
  
  <!-- Right Diagonal (Red) -->
  <rect x="22" y="6" width="2" height="4" fill="#EA4335"/>
  <rect x="20" y="8" width="2" height="4" fill="#EA4335"/>
  <rect x="18" y="10" width="2" height="4" fill="#EA4335"/>
  <rect x="16" y="12" width="2" height="4" fill="#EA4335"/>
</svg>
