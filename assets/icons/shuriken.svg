<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
<defs><style>
@keyframes lanternGlow{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes flagWave{0%,100%{transform:skewX(0)}30%{transform:skewX(3deg)}70%{transform:skewX(-2deg)}}
.lg{animation:lanternGlow 2s ease-in-out infinite}.lg2{animation-delay:.7s}.lg3{animation-delay:1.4s}
.fl{animation:flagWave 2.5s ease-in-out infinite;transform-origin:center top}
</style></defs>

<!-- Base/foundation -->
<rect x="16" y="72" width="48" height="4" fill="#5C5040"/>
<rect x="18" y="68" width="44" height="4" fill="#6B5E4D"/>
<rect x="20" y="76" width="40" height="4" fill="#4A4238"/>
<!-- Steps -->
<rect x="32" y="66" width="16" height="2" fill="#8B7D6B"/>
<rect x="34" y="64" width="12" height="2" fill="#8B7D6B"/>

<!-- First floor walls -->
<rect x="22" y="50" width="36" height="18" fill="#C9B99A"/>
<rect x="24" y="52" width="32" height="14" fill="#D4C6A8"/>
<!-- Pillars -->
<rect x="22" y="50" width="4" height="18" fill="#8B7D6B"/>
<rect x="54" y="50" width="4" height="18" fill="#8B7D6B"/>
<rect x="36" y="50" width="4" height="18" fill="#8B7D6B" opacity=".5"/>
<!-- Door -->
<rect x="34" y="56" width="12" height="12" fill="#2A1D15"/>
<rect x="38" y="56" width="4" height="12" fill="#3D2B1F"/>
<rect x="36" y="60" width="2" height="2" fill="#FFD700"/>
<!-- Windows -->
<rect x="26" y="54" width="6" height="6" fill="#1A0A2E"/>
<rect x="48" y="54" width="6" height="6" fill="#1A0A2E"/>
<rect x="28" y="56" width="2" height="2" fill="#58A6FF" class="lg" opacity=".6"/>
<rect x="50" y="56" width="2" height="2" fill="#58A6FF" class="lg lg2" opacity=".6"/>

<!-- First roof -->
<rect x="14" y="46" width="52" height="4" fill="#8B2020"/>
<rect x="12" y="44" width="56" height="4" fill="#A02828"/>
<rect x="10" y="42" width="60" height="2" fill="#C03030"/>
<!-- Roof edge details -->
<rect x="10" y="42" width="4" height="2" fill="#D44040"/>
<rect x="66" y="42" width="4" height="2" fill="#D44040"/>
<rect x="12" y="44" width="2" height="2" fill="#6B1515"/>
<rect x="66" y="44" width="2" height="2" fill="#6B1515"/>

<!-- Second floor -->
<rect x="26" y="32" width="28" height="12" fill="#C9B99A"/>
<rect x="28" y="34" width="24" height="8" fill="#D4C6A8"/>
<rect x="26" y="32" width="4" height="12" fill="#8B7D6B"/>
<rect x="50" y="32" width="4" height="12" fill="#8B7D6B"/>
<!-- Windows -->
<rect x="32" y="34" width="6" height="6" fill="#1A0A2E"/>
<rect x="42" y="34" width="6" height="6" fill="#1A0A2E"/>
<rect x="34" y="36" width="2" height="2" fill="#FFD700" class="lg lg2"/>
<rect x="44" y="36" width="2" height="2" fill="#FFD700" class="lg lg3"/>

<!-- Second roof -->
<rect x="20" y="28" width="40" height="4" fill="#8B2020"/>
<rect x="18" y="26" width="44" height="4" fill="#A02828"/>
<rect x="16" y="24" width="48" height="2" fill="#C03030"/>
<rect x="16" y="24" width="4" height="2" fill="#D44040"/>
<rect x="60" y="24" width="4" height="2" fill="#D44040"/>

<!-- Third floor / top -->
<rect x="32" y="16" width="16" height="8" fill="#C9B99A"/>
<rect x="34" y="18" width="12" height="4" fill="#D4C6A8"/>
<rect x="38" y="18" width="4" height="4" fill="#1A0A2E"/>
<rect x="39" y="19" width="2" height="2" fill="#FF6B8A" class="lg"/>

<!-- Top roof -->
<rect x="26" y="12" width="28" height="4" fill="#8B2020"/>
<rect x="24" y="10" width="32" height="4" fill="#A02828"/>
<rect x="22" y="8" width="36" height="2" fill="#C03030"/>
<rect x="22" y="8" width="4" height="2" fill="#D44040"/>
<rect x="54" y="8" width="4" height="2" fill="#D44040"/>

<!-- Spire -->
<rect x="38" y="2" width="4" height="6" fill="#FFD700"/>
<rect x="39" y="0" width="2" height="2" fill="#FFE44D"/>

<!-- Flag -->
<g class="fl"><rect x="42" y="2" width="8" height="4" fill="#FF6B8A" opacity=".9"/><rect x="44" y="3" width="4" height="2" fill="#FFD4DE"/></g>

<!-- Lanterns hanging from roofs -->
<rect x="14" y="44" width="2" height="4" fill="#8B6914"/>
<rect x="13" y="48" width="4" height="4" fill="#FF4500" class="lg"/>
<rect x="64" y="44" width="2" height="4" fill="#8B6914"/>
<rect x="63" y="48" width="4" height="4" fill="#FF4500" class="lg lg3"/>
</svg>
