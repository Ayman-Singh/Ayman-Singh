<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
<defs><style>
@keyframes screenFlash{0%{fill:#1A0A2E}25%{fill:#0A2A4A}50%{fill:#2A0A3E}75%{fill:#0A3A2A}100%{fill:#1A0A2E}}
@keyframes btnPulse{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes stickMove{0%,100%{transform:translate(0,0)}25%{transform:translate(-1px,0)}50%{transform:translate(0,-1px)}75%{transform:translate(1px,0)}}
.scr{animation:screenFlash 3s ease-in-out infinite}
.bp{animation:btnPulse 1.5s ease-in-out infinite}.bp2{animation-delay:.3s}.bp3{animation-delay:.6s}.bp4{animation-delay:.9s}
.stk{animation:stickMove 2s steps(4) infinite}
</style></defs>

<!-- Cabinet body -->
<rect x="18" y="10" width="44" height="60" fill="#2D2D3D"/>
<rect x="16" y="8" width="48" height="4" fill="#3D3D50"/>
<rect x="20" y="12" width="40" height="2" fill="#4A4A60"/>
<!-- Cabinet sides (3D effect) -->
<rect x="16" y="12" width="4" height="56" fill="#222235"/>
<rect x="60" y="12" width="4" height="56" fill="#222235"/>
<!-- Bottom base -->
<rect x="20" y="68" width="40" height="4" fill="#1A1A28"/>
<rect x="22" y="72" width="36" height="4" fill="#15152A"/>
<rect x="24" y="76" width="32" height="4" fill="#1A1A28"/>

<!-- Screen bezel -->
<rect x="22" y="14" width="36" height="26" fill="#111125"/>
<!-- Screen -->
<rect x="24" y="16" width="32" height="22" class="scr"/>
<!-- Screen content (pixel art game scene) -->
<rect x="26" y="20" width="4" height="6" fill="#FF6B8A"/>
<rect x="28" y="18" width="4" height="2" fill="#FF87A0"/>
<rect x="26" y="26" width="4" height="2" fill="#FF6B8A"/>
<!-- Enemy -->
<rect x="44" y="22" width="4" height="4" fill="#58A6FF"/>
<rect x="42" y="20" width="2" height="2" fill="#58A6FF"/>
<rect x="48" y="20" width="2" height="2" fill="#58A6FF"/>
<!-- Stars on screen -->
<rect x="34" y="18" width="2" height="2" fill="#FFD700" opacity=".8"/>
<rect x="40" y="20" width="2" height="2" fill="#FFD700" opacity=".6"/>
<rect x="36" y="26" width="2" height="2" fill="#FFD700" opacity=".7"/>
<!-- Ground line -->
<rect x="24" y="32" width="32" height="2" fill="#3D6DA8" opacity=".5"/>
<!-- Score text -->
<rect x="26" y="34" width="2" height="2" fill="#FF6B8A" opacity=".6"/>
<rect x="30" y="34" width="2" height="2" fill="#FF6B8A" opacity=".6"/>
<rect x="34" y="34" width="2" height="2" fill="#FF6B8A" opacity=".6"/>
<!-- Screen reflection -->
<rect x="50" y="16" width="4" height="8" fill="#FFFFFF" opacity=".06"/>

<!-- Control panel -->
<rect x="20" y="42" width="40" height="14" fill="#3D3D50"/>
<rect x="22" y="44" width="36" height="10" fill="#4A4A60"/>
<!-- Joystick -->
<g class="stk">
<rect x="28" y="46" width="4" height="2" fill="#222235"/>
<rect x="26" y="48" width="8" height="4" fill="#333348"/>
<rect x="28" y="48" width="4" height="4" fill="#444460"/>
<rect x="29" y="44" width="2" height="4" fill="#555570"/>
<rect x="28" y="42" width="4" height="3" fill="#FF6B8A"/>
</g>
<!-- Buttons -->
<rect x="40" y="46" width="4" height="4" fill="#FF6B8A" class="bp"/>
<rect x="46" y="44" width="4" height="4" fill="#58A6FF" class="bp bp2"/>
<rect x="52" y="46" width="4" height="4" fill="#FFD700" class="bp bp3"/>
<rect x="46" y="50" width="4" height="4" fill="#4ADE80" class="bp bp4"/>
<!-- Button shadows -->
<rect x="40" y="50" width="4" height="1" fill="#D44060"/>
<rect x="46" y="48" width="4" height="1" fill="#3D6DA8"/>
<rect x="52" y="50" width="4" height="1" fill="#C0A800"/>

<!-- Coin slot -->
<rect x="36" y="58" width="8" height="4" fill="#222235"/>
<rect x="38" y="60" width="4" height="2" fill="#FFD700" opacity=".5"/>
<!-- Coin slot label -->
<rect x="37" y="56" width="6" height="2" fill="#FFD700" opacity=".3"/>

<!-- Marquee top -->
<rect x="20" y="8" width="40" height="4" fill="#FF6B8A"/>
<rect x="22" y="8" width="8" height="2" fill="#FFD4DE"/>
<rect x="34" y="8" width="12" height="2" fill="#FFD4DE"/>
<rect x="50" y="8" width="8" height="2" fill="#FFD4DE"/>
<!-- Side lights -->
<rect x="18" y="14" width="2" height="4" fill="#FF6B8A" class="bp"/>
<rect x="60" y="14" width="2" height="4" fill="#FF6B8A" class="bp bp3"/>
<rect x="18" y="22" width="2" height="4" fill="#58A6FF" class="bp bp2"/>
<rect x="60" y="22" width="2" height="4" fill="#58A6FF" class="bp bp4"/>
</svg>
