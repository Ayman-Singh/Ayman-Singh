<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- 
    True LeetCode C-bracket.
    Background transparent.
  -->
  
  <!-- Outer Bracket (Cream/White) -->
  <!-- Top Arm -->
  <rect x="22" y="2" width="4" height="4" fill="#E8E8E8"/>
  <rect x="18" y="2" width="4" height="4" fill="#E8E8E8"/>
  <rect x="18" y="6" width="4" height="4" fill="#E8E8E8"/>
  <rect x="14" y="6" width="4" height="4" fill="#E8E8E8"/>
  <rect x="14" y="10" width="4" height="4" fill="#E8E8E8"/>
  <rect x="10" y="10" width="4" height="4" fill="#E8E8E8"/>
  <!-- Middle Left Apex -->
  <rect x="10" y="14" width="4" height="4" fill="#E8E8E8"/>
  <!-- Bottom Arm -->
  <rect x="10" y="18" width="4" height="4" fill="#E8E8E8"/>
  <rect x="14" y="18" width="4" height="4" fill="#E8E8E8"/>
  <rect x="14" y="22" width="4" height="4" fill="#E8E8E8"/>
  <rect x="18" y="22" width="4" height="4" fill="#E8E8E8"/>
  <rect x="18" y="26" width="4" height="4" fill="#E8E8E8"/>
  <rect x="22" y="26" width="4" height="4" fill="#E8E8E8"/>

  <!-- Inner Bevel (Silver/Gray) -->
  <!-- Top Arm -->
  <rect x="20" y="4" width="2" height="2" fill="#C0C0C0"/>
  <rect x="18" y="4" width="2" height="2" fill="#C0C0C0"/>
  <rect x="18" y="6" width="2" height="2" fill="#C0C0C0"/>
  <rect x="16" y="8" width="2" height="2" fill="#C0C0C0"/>
  <rect x="14" y="8" width="2" height="2" fill="#C0C0C0"/>
  <rect x="14" y="10" width="2" height="2" fill="#C0C0C0"/>
  <rect x="12" y="12" width="2" height="2" fill="#C0C0C0"/>
  <rect x="10" y="12" width="2" height="2" fill="#C0C0C0"/>
  <!-- Bottom Arm -->
  <rect x="12" y="20" width="2" height="2" fill="#C0C0C0"/>
  <rect x="14" y="20" width="2" height="2" fill="#C0C0C0"/>
  <rect x="14" y="22" width="2" height="2" fill="#C0C0C0"/>
  <rect x="16" y="24" width="2" height="2" fill="#C0C0C0"/>
  <rect x="18" y="24" width="2" height="2" fill="#C0C0C0"/>
  <rect x="18" y="26" width="2" height="2" fill="#C0C0C0"/>
  <rect x="20" y="28" width="2" height="2" fill="#C0C0C0"/>

  <!-- Horizontal Orange Bar (Piercing the apex) -->
  <rect x="14" y="14" width="12" height="4" fill="#FFA116"/>
  <!-- Highlight on Orange Bar -->
  <rect x="14" y="14" width="12" height="2" fill="#FFCF70"/>
</svg>
