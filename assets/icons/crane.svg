<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
<defs><style>
@keyframes flap{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes tailWag{0%,100%{transform:rotate(0)}50%{transform:rotate(5deg)}}
.wing{animation:flap 1.5s ease-in-out infinite;transform-origin:40px 38px}
.body{animation:bob 2s ease-in-out infinite}
.tail{animation:tailWag 2s ease-in-out infinite;transform-origin:14px 38px}
</style></defs>

<g class="body">
<!-- Body core -->
<rect x="28" y="32" width="6" height="6" fill="#E8E0CC"/>
<rect x="34" y="30" width="6" height="8" fill="#F5F0E0"/>
<rect x="40" y="28" width="6" height="10" fill="#F5F0E0"/>
<rect x="46" y="30" width="6" height="8" fill="#E8E0CC"/>
<rect x="52" y="32" width="4" height="6" fill="#DDD5BC"/>
<!-- Body underside -->
<rect x="34" y="38" width="18" height="4" fill="#DDD5BC"/>
<rect x="30" y="38" width="4" height="4" fill="#D4C6A8"/>
<!-- Body top -->
<rect x="34" y="28" width="14" height="2" fill="#F5F0E0"/>
<rect x="38" y="26" width="8" height="2" fill="#E8E0CC"/>
<!-- Fold lines (origami creases) -->
<rect x="38" y="30" width="1" height="8" fill="#C9B99A" opacity=".4"/>
<rect x="45" y="30" width="1" height="8" fill="#C9B99A" opacity=".4"/>

<!-- Neck -->
<rect x="54" y="28" width="4" height="6" fill="#F5F0E0"/>
<rect x="58" y="24" width="4" height="8" fill="#E8E0CC"/>
<rect x="56" y="26" width="4" height="4" fill="#F5F0E0"/>
<!-- Head -->
<rect x="60" y="20" width="6" height="6" fill="#F5F0E0"/>
<rect x="62" y="18" width="6" height="4" fill="#E8E0CC"/>
<rect x="64" y="16" width="4" height="4" fill="#F5F0E0"/>
<!-- Beak -->
<rect x="68" y="18" width="4" height="2" fill="#FFD700"/>
<rect x="70" y="20" width="4" height="2" fill="#C0A800"/>
<rect x="72" y="18" width="2" height="2" fill="#FFE44D"/>
<!-- Eye -->
<rect x="64" y="20" width="2" height="2" fill="#1A1A28"/>
<!-- Red crown (Japanese crane mark) -->
<rect x="62" y="16" width="4" height="2" fill="#FF4500"/>
<rect x="64" y="14" width="2" height="2" fill="#FF6B3A"/>

<!-- Upper wing -->
<g class="wing">
<rect x="30" y="24" width="6" height="6" fill="#E8E0CC"/>
<rect x="34" y="22" width="6" height="6" fill="#F5F0E0"/>
<rect x="28" y="20" width="6" height="6" fill="#DDD5BC"/>
<rect x="24" y="16" width="6" height="6" fill="#E8E0CC"/>
<rect x="20" y="12" width="6" height="6" fill="#F5F0E0"/>
<rect x="16" y="10" width="6" height="4" fill="#DDD5BC"/>
<rect x="12" y="8" width="6" height="4" fill="#E8E0CC"/>
<!-- Wing tip feathers -->
<rect x="10" y="6" width="4" height="4" fill="#C9B99A"/>
<rect x="8" y="4" width="4" height="4" fill="#DDD5BC"/>
<rect x="14" y="6" width="4" height="4" fill="#D4C6A8"/>
<!-- Wing crease details -->
<rect x="26" y="18" width="1" height="4" fill="#C9B99A" opacity=".5"/>
<rect x="22" y="14" width="1" height="4" fill="#C9B99A" opacity=".5"/>
<rect x="18" y="10" width="1" height="4" fill="#C9B99A" opacity=".5"/>
<!-- Wing highlight -->
<rect x="32" y="22" width="2" height="2" fill="#FFFFFF" opacity=".3"/>
<rect x="22" y="14" width="2" height="2" fill="#FFFFFF" opacity=".2"/>
</g>

<!-- Tail -->
<g class="tail">
<rect x="22" y="34" width="6" height="4" fill="#E8E0CC"/>
<rect x="16" y="32" width="6" height="4" fill="#F5F0E0"/>
<rect x="10" y="30" width="6" height="4" fill="#DDD5BC"/>
<rect x="6" y="34" width="6" height="4" fill="#E8E0CC"/>
<rect x="8" y="32" width="4" height="2" fill="#F5F0E0"/>
<!-- Tail tip -->
<rect x="4" y="36" width="4" height="2" fill="#C9B99A"/>
<rect x="2" y="34" width="4" height="4" fill="#D4C6A8"/>
<!-- Tail feather tips - black -->
<rect x="4" y="38" width="4" height="2" fill="#1A1A28"/>
<rect x="2" y="36" width="2" height="2" fill="#1A1A28"/>
<rect x="8" y="36" width="2" height="2" fill="#1A1A28"/>
</g>

<!-- Legs -->
<rect x="38" y="42" width="2" height="10" fill="#3D3D50"/>
<rect x="46" y="42" width="2" height="10" fill="#3D3D50"/>
<!-- Feet -->
<rect x="34" y="52" width="8" height="2" fill="#3D3D50"/>
<rect x="42" y="52" width="8" height="2" fill="#3D3D50"/>
</g>

<!-- Shadow on ground -->
<rect x="20" y="56" width="40" height="2" fill="#0D1117" opacity=".2"/>
</svg>
