<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Outer border/shadow for 3D depth -->
  <rect x="4" y="0" width="24" height="32" fill="#064280"/>
  <rect x="0" y="4" width="32" height="24" fill="#064280"/>
  <rect x="2" y="2" width="28" height="28" fill="#064280"/>

  <!-- Main body -->
  <rect x="4" y="0" width="24" height="30" fill="#0A66C2"/>
  <rect x="0" y="4" width="30" height="24" fill="#0A66C2"/>
  <rect x="2" y="2" width="26" height="26" fill="#0A66C2"/>

  <!-- Top left highlight -->
  <rect x="4" y="0" width="24" height="2" fill="#58A6FF"/>
  <rect x="2" y="2" width="2" height="2" fill="#58A6FF"/>
  <rect x="0" y="4" width="2" height="24" fill="#58A6FF"/>

  <!-- 'i' dot -->
  <rect x="8" y="6" width="4" height="4" fill="#FFFFFF"/>
  <rect x="10" y="8" width="2" height="2" fill="#D3D3D3"/>

  <!-- 'i' stem -->
  <rect x="8" y="12" width="4" height="14" fill="#FFFFFF"/>
  <rect x="10" y="12" width="2" height="14" fill="#F0F0F0"/>

  <!-- 'n' left stem -->
  <rect x="16" y="12" width="4" height="14" fill="#FFFFFF"/>
  <rect x="18" y="12" width="2" height="14" fill="#F0F0F0"/>

  <!-- 'n' right stem -->
  <rect x="24" y="14" width="4" height="12" fill="#FFFFFF"/>
  <rect x="26" y="14" width="2" height="12" fill="#F0F0F0"/>

  <!-- 'n' arch -->
  <rect x="20" y="12" width="4" height="4" fill="#FFFFFF"/>
  <rect x="20" y="14" width="2" height="2" fill="#F0F0F0"/>
</svg>
