<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
<defs><style>
@keyframes sway{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(.8deg)}}
@keyframes petal1{0%{transform:translate(0,0) rotate(0);opacity:0}8%{opacity:1}92%{opacity:.6}100%{transform:translate(12px,40px) rotate(360deg);opacity:0}}
@keyframes petal2{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.9}90%{opacity:.5}100%{transform:translate(-8px,35px) rotate(-300deg);opacity:0}}
@keyframes petal3{0%{transform:translate(0,0) rotate(0);opacity:0}6%{opacity:1}94%{opacity:.7}100%{transform:translate(6px,38px) rotate(240deg);opacity:0}}
.canopy{animation:sway 3s ease-in-out infinite;transform-origin:40px 50px}
.fp1{animation:petal1 4s linear infinite}.fp2{animation:petal2 5s linear infinite;animation-delay:1.5s}
.fp3{animation:petal3 3.5s linear infinite;animation-delay:3s}.fp4{animation:petal1 4.5s linear infinite;animation-delay:2s}
.fp5{animation:petal2 3s linear infinite;animation-delay:.8s}
</style></defs>

<!-- Pot -->
<rect x="28" y="66" width="24" height="4" fill="#8B5E3C"/>
<rect x="30" y="62" width="20" height="4" fill="#A0704B"/>
<rect x="30" y="66" width="20" height="6" fill="#8B5E3C"/>
