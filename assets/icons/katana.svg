<rect x="48" y="34" width="4" height="4" fill="#5C3A2E"/>
<rect x="52" y="32" width="4" height="4" fill="#6B4535"/>
<!-- Upper branch -->
<rect x="36" y="36" width="4" height="4" fill="#5C3A2E"/>
<rect x="38" y="32" width="4" height="6" fill="#6B4535"/>

<g class="canopy">
<!-- ═══ BLOSSOM CANOPY ═══ -->
