<rect x="58" y="28" width="4" height="2" fill="#D44060"/>
<rect x="52" y="28" width="4" height="2" fill="#D44060"/>
</g>

<!-- Falling petals -->
<g class="fp1"><rect x="18" y="30" width="3" height="3" fill="#FF87A0" opacity=".9"/></g>
<g class="fp2"><rect x="56" y="22" width="3" height="3" fill="#FFA0B4" opacity=".85"/></g>
<g class="fp3"><rect x="36" y="26" width="3" height="3" fill="#FF6B8A" opacity=".9"/></g>
<g class="fp4"><rect x="48" y="18" width="3" height="3" fill="#FF87A0" opacity=".8"/></g>
<g class="fp5"><rect x="26" y="24" width="3" height="3" fill="#FFA0B4" opacity=".85"/></g>
</svg>
