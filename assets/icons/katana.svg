<rect x="32" y="58" width="16" height="4" fill="#3D2B1F"/>
<rect x="36" y="56" width="8" height="2" fill="#4A3530"/>

<!-- Trunk -->
<rect x="38" y="48" width="4" height="10" fill="#5C3A2E"/>
